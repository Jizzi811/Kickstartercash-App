name: CI

# Safety net for a deploy-to-test project: catch backend import errors and
# frontend build breaks on every push/PR, BEFORE Render/Netlify deploy.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend – import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-deploy.txt
      - name: Syntax + import check
        working-directory: backend
        env:
          MONGO_URL: ""
          DB_NAME: brandmind_ci
        run: |
          python -c "import ast; ast.parse(open('server.py').read()); print('syntax OK')"
          python -c "import server; print('backend import OK')"
      - name: Static check – no undefined names (catches missed imports in refactors)
        working-directory: backend
        run: |
          pip install pyflakes
          OUT="$(python -m pyflakes server.py app || true)"
          echo "$OUT"
          if echo "$OUT" | grep -q "undefined name"; then
            echo "::error::pyflakes found undefined name(s) – a reference is missing an import."
            exit 1
          fi

  frontend:
    name: Frontend – build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        # --legacy-peer-deps mirrors the deploy install; the project has a known
        # react-day-picker/date-fns peer-dep mismatch (tech debt, tracked in ROADMAP).
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: frontend
        env:
          CI: false   # don't fail the build on lint warnings (CRA/craco)
        run: npm run build
