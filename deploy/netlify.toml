# Brandmind frontend on Netlify.
# COPY THIS FILE TO THE ROOT of the new Brandmind repo (as netlify.toml).
# It is intentionally kept under deploy/ in this repo so it does NOT affect
# the existing Kickstartercash Netlify sites.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/build"

[build.environment]
  # CRA treats warnings as errors when CI=true; keep the build strict.
  CI = "true"

# SPA fallback so client-side routes (/auth, /brand-brain, …) work on reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
