# Brandmind frontend on Netlify (reference / spinoff copy).
# Do NOT place this at the repo root – kashbot2 and other sites share this repo
# and deploy different directories. For kashbot3, set these values in the Netlify UI
# or use .github/workflows/deploy-frontend.yml with NETLIFY_SITE_ID.
[build]
  base = "frontend"
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  NODE_VERSION = "20"

# SPA fallback so client-side routes (/auth, /brand-brain, …) work on reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
