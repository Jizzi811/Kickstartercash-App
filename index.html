<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KASHBOT | KickstarterCash KI-Agent System</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;height:100%}
  body{
    background:radial-gradient(circle at 50% 35%,#1c170f 0%,#120e09 60%,#0a0806 100%);
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    color:#F3ECDD;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px 0 60px;user-select:none;overflow:hidden;
  }

  /* Particles */
  .particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .particle{
    position:absolute;width:2px;height:2px;border-radius:50%;background:#EBCB72;opacity:0;
    animation:float var(--dur,8s) ease-in-out infinite;animation-delay:var(--delay,0s);
    left:var(--x,50%);top:110%;
  }
  @keyframes float{0%{opacity:0;transform:translateY(0) scale(1)}10%{opacity:.5}90%{opacity:.15}100%{opacity:0;transform:translateY(-110vh) scale(.3)}}

  /* Orb Stage */
  .stage{position:relative;width:360px;height:360px;display:flex;align-items:center;justify-content:center;z-index:1}
  .orb{
    position:relative;width:210px;height:210px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#FBE9A6,#F6DC8E 25%,#D9A93F 60%,#B07F2A 100%);
    box-shadow:0 0 60px 12px rgba(217,169,63,.55),0 0 140px 30px rgba(176,127,42,.30),inset 0 0 50px rgba(255,255,255,.30);
    transition:.4s;animation:breathe 5s ease-in-out infinite;
  }
  .orb::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.9),rgba(251,233,166,.15) 60%,transparent 70%);filter:blur(2px)}
  .orb-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(251,233,166,.6));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:Georgia,serif;pointer-events:none;z-index:2}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(235,203,114,.30);top:50%;left:50%;transform:translate(-50%,-50%)}
  .ring.r1{width:265px;height:265px;border-style:dashed;animation:spin 14s linear infinite}
  .ring.r2{width:315px;height:315px;border-color:rgba(235,203,114,.15);animation:spin 22s linear infinite reverse}
  .ring.r3{width:360px;height:360px;border-color:rgba(235,203,114,.08);border-top-color:rgba(235,203,114,.45);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .stage.listening .orb{animation:breathe 1.2s ease-in-out infinite;box-shadow:0 0 80px 20px rgba(43,255,180,.45),0 0 160px 40px rgba(20,220,150,.25),inset 0 0 50px rgba(255,255,255,.35);filter:hue-rotate(-20deg)}
  .stage.speaking .orb{box-shadow:0 0 100px 28px rgba(251,233,166,.75),0 0 180px 50px rgba(217,169,63,.50),inset 0 0 60px rgba(255,255,255,.50)}
  .orb:hover{box-shadow:0 0 90px 22px rgba(246,220,142,.85),0 0 180px 50px rgba(217,169,63,.55),inset 0 0 60px rgba(255,255,255,.45)}

  .title{letter-spacing:.5em;font-size:14px;margin-top:32px;opacity:.9;z-index:1;background:linear-gradient(135deg,#FBE9A6,#EBCB72);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 12px rgba(235,203,114,.6));font-weight:700}
  .subtitle{font-size:11px;letter-spacing:.3em;opacity:.45;margin-top:8px;text-transform:uppercase;color:#C9BB9B;z-index:1}
  .hint{font-size:11px;opacity:.28;margin-top:18px;letter-spacing:.08em;color:#9f937c;z-index:1;animation:blink 3s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.28}50%{opacity:.5}}

  /* Backdrop */
  #jrv-backdrop{display:none;position:fixed;inset:0;z-index:100;background:#00000099;backdrop-filter:blur(8px)}
  #jrv-backdrop.open{display:block;animation:bdIn .22s ease}
  @keyframes bdIn{from{opacity:0}to{opacity:1}}

  /* Chat Panel */
  #jrv-panel{
    position:fixed;z-index:101;top:50%;left:50%;
    width:720px;max-width:calc(100vw - 20px);
    height:860px;max-height:calc(100vh - 20px);
    background:#0d0b08;border:1px solid #3a2c10;border-radius:24px;
    box-shadow:0 32px 100px #000e,0 0 0 1px rgba(235,203,114,.08);
    flex-direction:column;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;
    display:none;transform:translate(-50%,-50%);
  }
  #jrv-panel.open{display:flex;animation:panelIn .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes panelIn{from{opacity:0;transform:translate(-50%,-48%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  /* Header */
  #jrv-head{padding:16px 20px 14px;background:linear-gradient(135deg,#1a1208,#120e09);border-bottom:1px solid #3a2c10;display:flex;align-items:center;gap:14px;flex-shrink:0}
  #jrv-logo{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 35%,#FBE9A6,#D9A93F 55%,#B07F2A 100%);box-shadow:0 0 16px rgba(217,169,63,.6);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:rgba(255,255,255,.9);font-family:Georgia,serif;transition:box-shadow .3s}
  #jrv-logo.speaking{animation:logoPulse 1.1s ease-in-out infinite}
  @keyframes logoPulse{0%,100%{box-shadow:0 0 20px rgba(251,233,166,.8),0 0 40px rgba(217,169,63,.5)}50%{box-shadow:0 0 40px rgba(251,233,166,1),0 0 70px rgba(235,203,114,.8)}}
  #jrv-head-info{flex:1}
  #jrv-head h2{font-size:.95rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin:0 0 2px;background:linear-gradient(135deg,#FBE9A6,#EBCB72);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  #jrv-tagline{font-size:.62rem;color:#5a5040;letter-spacing:.08em;margin-bottom:2px}
  #jrv-status{font-size:.67rem;color:#7d745f;letter-spacing:.04em;transition:color .3s;display:flex;align-items:center;gap:5px}
  #jrv-status::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade8088;transition:background .3s}
  #jrv-status.listening{color:#7ec8a0}
  #jrv-status.listening::before{background:#7ec8a0;box-shadow:0 0 6px #7ec8a088}
  #jrv-status.speaking::before{background:#F6DC8E;box-shadow:0 0 6px #F6DC8E88;animation:statusPulse .8s ease-in-out infinite}
  #jrv-status.thinking::before{background:#a78bfa;box-shadow:0 0 6px #a78bfa88;animation:statusPulse .6s ease-in-out infinite}
  @keyframes statusPulse{0%,100%{opacity:1}50%{opacity:.3}}
  #jrv-close{background:none;border:none;cursor:pointer;color:#6f6655;font-size:1.1rem;line-height:1;padding:6px 8px;border-radius:8px;transition:color .2s,background .2s}
  #jrv-close:hover{color:#EBCB72;background:rgba(235,203,114,.1)}

  /* Department pills */
  #jrv-depts{padding:8px 12px;background:#0f0c09;border-bottom:1px solid #2a1e06;display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
  #jrv-depts::-webkit-scrollbar{height:0}
  .dept-pill{flex-shrink:0;background:none;border:1px solid #2a2010;border-radius:20px;padding:4px 10px;font-size:.66rem;color:#7d745f;cursor:pointer;transition:all .2s;letter-spacing:.04em;white-space:nowrap}
  .dept-pill:hover{color:#fff;background:rgba(255,255,255,.05)}

  /* Messages */
  #jrv-msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  #jrv-msgs::-webkit-scrollbar{width:4px}
  #jrv-msgs::-webkit-scrollbar-thumb{background:#3a2c10;border-radius:3px}

  .jm{max-width:86%;padding:11px 14px;border-radius:16px;font-size:.87rem;line-height:1.6;animation:msgIn .2s ease}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .jm.user{align-self:flex-end;background:linear-gradient(135deg,#2a1e06,#1e1504);border:1px solid #3a2c10;border-bottom-right-radius:4px;color:#F6ECCF}
  .jm.ceo{align-self:flex-start;background:#161209;border:1px solid #3a2c10;border-bottom-left-radius:4px;color:#C9BB9B}
  .jm.agent{align-self:flex-start;border-bottom-left-radius:4px;color:#e8e0d0}
  .jm.delegation{align-self:center;background:none;border:1px solid #2a2010;border-radius:20px;padding:8px 16px;font-size:.72rem;color:#7d745f;letter-spacing:.04em;display:flex;align-items:center;gap:8px;max-width:90%}
  .jm.error{align-self:flex-start;background:#1e0a0a;border:1px solid #5c1a1a;color:#f08080;border-bottom-left-radius:4px}
  .jlbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;opacity:.6;display:flex;align-items:center;gap:7px}
  .agent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .spkbtn{background:none;border:none;cursor:pointer;font-size:.78rem;opacity:.4;padding:0;line-height:1;transition:opacity .2s}
  .spkbtn:hover{opacity:1}

  /* Thinking dots */
  .thinking-dots{display:inline-flex;gap:4px;align-items:center}
  .thinking-dots span{width:7px;height:7px;border-radius:50%;background:#6a6050;animation:dot .9s ease-in-out infinite}
  .thinking-dots span:nth-child(2){animation-delay:.18s}
  .thinking-dots span:nth-child(3){animation-delay:.36s}
  @keyframes dot{0%,60%,100%{transform:scale(.8);opacity:.4}30%{transform:scale(1.2);opacity:1}}

  /* Delegation animation */
  .delegation-arrow{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  /* Footer */
  #jrv-foot{padding:12px 14px 14px;background:#120e09;border-top:1px solid #3a2c10;display:flex;gap:8px;align-items:center;flex-shrink:0}
  #jrv-input{flex:1;background:#0a0806;border:1px solid #2a2010;border-radius:12px;padding:11px 14px;color:#F3ECDD;font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit}
  #jrv-input:focus{border-color:#EBCB72;box-shadow:0 0 0 2px rgba(235,203,114,.07)}
  #jrv-input::placeholder{color:#4a4030}
  #jrv-mic{background:#1c170f;border:1px solid #3a2c10;border-radius:12px;padding:11px 13px;color:#7d745f;font-size:1rem;cursor:pointer;transition:background .2s,color .2s;line-height:1}
  #jrv-mic:hover{background:#2a1e06;color:#EBCB72}
  #jrv-mic.active{background:#1a1200;border-color:#c08020;color:#f0c060;animation:micPulse .8s ease-in-out infinite}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,128,32,.4)}50%{box-shadow:0 0 0 6px rgba(192,128,32,0)}}
  #jrv-send{background:linear-gradient(135deg,#E7C167,#D9A93F 50%,#B07F2A);border:none;border-radius:12px;padding:11px 18px;color:#1a1206;font-size:.85rem;font-weight:800;cursor:pointer;transition:filter .2s,transform .1s;letter-spacing:.06em;font-family:inherit}
  #jrv-send:hover{filter:brightness(1.15)}
  #jrv-send:active{transform:scale(.97)}
  #jrv-send:disabled,#jrv-mic:disabled{opacity:.35;cursor:not-allowed}
  #jrv-badge{text-align:center;font-size:.58rem;color:#2a2010;padding:0 14px 10px;letter-spacing:.06em}

  /* Studio CTA Button */
  .studio-cta{
    display:flex;align-items:center;gap:10px;margin-top:10px;
    padding:11px 14px;border-radius:12px;border:1px solid;
    cursor:pointer;text-decoration:none;font-size:.82rem;font-weight:700;
    transition:filter .2s,transform .1s;letter-spacing:.04em;
    animation:msgIn .3s ease .1s both;
  }
  .studio-cta:hover{filter:brightness(1.15);transform:translateY(-1px)}
  .studio-cta:active{transform:scale(.98)}
  .studio-cta-icon{font-size:1.1rem;flex-shrink:0}
  .studio-cta-text{flex:1}
  .studio-cta-arrow{opacity:.6;font-size:.8rem}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="stage" id="stage">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="orb" id="orb">
    <div class="orb-letter">K</div>
  </div>
</div>
<div class="title">K &middot; A &middot; S &middot; H &middot; B &middot; O &middot; T</div>
<div class="subtitle">KickstarterCash · KI-Agent System</div>
<div class="hint">&#x25BA; Orb anklicken zum Starten</div>

<div id="jrv-backdrop"></div>

<div id="jrv-panel" role="dialog" aria-modal="true" aria-label="Kashbot KI-Assistent">
  <div id="jrv-head">
    <div id="jrv-logo">K</div>
    <div id="jrv-head-info">
      <h2>KASHBOT</h2>
      <div id="jrv-tagline">KickstarterCash · CEO Agent</div>
      <div id="jrv-status">Online</div>
    </div>
    <button id="jrv-close" title="Schließen">✕</button>
  </div>

  <div id="jrv-depts">
    <button class="dept-pill" data-dept="marketing"  style="--c:#D4AF37" data-prompt="Ich brauche Hilfe mit meiner Marketing-Strategie für KickstarterCash.">🎯 Marketing</button>
    <button class="dept-pill" data-dept="design"     style="--c:#C084FC" data-prompt="Ich brauche Hilfe beim Design – Logos, Grafiken oder Branding.">🎨 Design</button>
    <button class="dept-pill" data-dept="video"      style="--c:#F472B6" data-prompt="Ich brauche Video-Ideen und Scripts für Social Media.">🎬 Video</button>
    <button class="dept-pill" data-dept="sales"      style="--c:#34D399" data-prompt="Hilf mir meinen Sales-Funnel und meine Conversion zu verbessern.">💰 Sales</button>
    <button class="dept-pill" data-dept="seo"        style="--c:#60A5FA" data-prompt="Ich brauche SEO-Hilfe – Keywords, Meta-Texte und Ranking.">🌍 SEO</button>
    <button class="dept-pill" data-dept="automation" style="--c:#FBBF24" data-prompt="Welche Automationen empfiehlst du mit n8n für mein Business?">⚡ Automation</button>
    <button class="dept-pill" data-dept="social"     style="--c:#FB923C" data-prompt="Erstelle einen Inhaltsplan für meine Social-Media-Kanäle.">📱 Social Media</button>
    <button class="dept-pill" data-dept="analytics"  style="--c:#A78BFA" data-prompt="Analysiere meine KPIs und gib mir einen Wachstumsplan.">📈 Analytics</button>
  </div>

  <div id="jrv-msgs" role="log" aria-live="polite"></div>

  <div id="jrv-foot">
    <input id="jrv-input" type="text" placeholder="Frag Kashbot etwas …" autocomplete="off" />
    <button id="jrv-mic" title="Spracheingabe">🎙️</button>
    <button id="jrv-send">Senden</button>
  </div>
  <div id="jrv-badge">Powered by KickstarterCash · Claude AI</div>
</div>

<script>
/* ── Config ──────────────────────────────────────────────────────────── */
// FastAPI Backend URL (deployed on Railway/Render)
const BACKEND_URL = "https://kickstartercash-app-production.up.railway.app";

// URL deiner React-App (Studio)
const APP_URL = "https://kickstartercash-studio.netlify.app";

// Mapping: Orb-Department → Backend agent_id
const DEPT_TO_AGENT_ID = {
  marketing:  "marketing",
  design:     "designer",
  video:      "video",
  sales:      "sales",
  seo:        "seo",
  automation: "automation",
  social:     "social",
  analytics:  "analytics",
  ceo:        "ceo",
};

/* ── Agent Definitionen ─────────────────────────────────────────────── */
const AGENTS = {
  ceo: {
    name: "Kashbot", emoji: "🤖", color: "#D4AF37",
    greeting: "Hey, willkommen bei KickstarterCash! Ich bin Kashbot, dein CEO-Agent. Ich schau mir deine Anfrage an und schicke dich direkt zum richtigen Spezialisten. Stell mir einfach deine Frage oder wähl eine Abteilung oben!",
  },
  marketing: {
    name: "Marco",   emoji: "🎯", color: "#D4AF37",
    role: "Marketing-Stratege",
    intro: "Ich bin Marco, dein Marketing-Spezialist. Ich übernehme!",
    studio: { path: "/agents", label: "Im Agenten-Studio öffnen", desc: "Kampagnen, Content & Strategie direkt umsetzen" },
  },
  design: {
    name: "Dina",    emoji: "🎨", color: "#C084FC",
    role: "Creative Designer",
    intro: "Ich bin Dina, deine Design-Expertin. Lass uns kreativ werden!",
    studio: { path: "/design", label: "Im Design Studio öffnen", desc: "Bilder, Logos & Grafiken direkt generieren" },
  },
  video: {
    name: "Viktor",  emoji: "🎬", color: "#F472B6",
    role: "Video-Produzent",
    intro: "Ich bin Viktor, dein Video-Spezialist. Kamera ab!",
    studio: { path: "/video", label: "Im Video Studio öffnen", desc: "Scripts, Storyboards & Video-Prompts erstellen" },
  },
  sales: {
    name: "Sara",    emoji: "💰", color: "#34D399",
    role: "Sales & Funnel Expertin",
    intro: "Ich bin Sara, deine Sales-Expertin. Lass uns deine Conversion steigern!",
    studio: { path: "/agents", label: "Mit Sara im Studio arbeiten", desc: "Funnel, Angebote & Verkaufstexte optimieren" },
  },
  seo: {
    name: "Simon",   emoji: "🌍", color: "#60A5FA",
    role: "SEO-Spezialist",
    intro: "Ich bin Simon, dein SEO-Experte. Lass uns dein Ranking verbessern!",
    studio: { path: "/seo", label: "Im SEO Studio öffnen", desc: "Keywords, Meta-Texte & Audit direkt ausführen" },
  },
  automation: {
    name: "Alex",    emoji: "⚡", color: "#FBBF24",
    role: "Automation-Architekt",
    intro: "Ich bin Alex, dein Automation-Experte. Lass uns Prozesse automatisieren!",
    studio: { path: "/automation", label: "Im Automation Studio öffnen", desc: "n8n-Workflows, Webhooks & APIs bauen" },
  },
  social: {
    name: "Sophia",  emoji: "📱", color: "#FB923C",
    role: "Social Media Managerin",
    intro: "Ich bin Sophia, deine Social-Media-Expertin. Lass uns viral gehen!",
    studio: { path: "/social", label: "Im Social Studio öffnen", desc: "Posts, Reels & Hashtags direkt erstellen" },
  },
  analytics: {
    name: "Anton",   emoji: "📈", color: "#A78BFA",
    role: "Analytics & Growth Experte",
    intro: "Ich bin Anton, dein Analytics-Experte. Lass uns die Zahlen sprechen lassen!",
    studio: { path: "/analytics", label: "Im Analytics Studio öffnen", desc: "KPIs, Reports & Wachstumspläne erstellen" },
  },
};

/* ── Keyword-Routing (lokale Erkennung) ─────────────────────────────── */
const KEYWORDS = {
  marketing:  /\b(marketing|kampagne|werbung|brand|reichweite|zielgruppe|content.?strategie|growth|newsletter)\b/i,
  design:     /\b(design|logo|grafik|branding|farbe|layout|banner|thumbnail|canva|figma|illustration|visual)\b/i,
  video:      /\b(video|reel|tiktok|youtube|shorts|script|storyboard|film|schnitt|capcut|veo|kling|runway)\b/i,
  sales:      /\b(sales|verkauf|funnel|conversion|upsell|angebot|preis|kunde|lead|closing|pitch|crm)\b/i,
  seo:        /\b(seo|keyword|ranking|google|meta|backlink|blog|artikel|suchmaschine|serp|ahrefs)\b/i,
  automation: /\b(automation|automatisierung|n8n|zapier|make|webhook|workflow|api|cron|integration|bot)\b/i,
  social:     /\b(social|instagram|facebook|twitter|linkedin|pinterest|hashtag|post|story|community|influencer)\b/i,
  analytics:  /\b(analytics|kpi|report|daten|statistik|ga4|auswertung|metrik|wachstum|a\/b|dashboard)\b/i,
};

function detectDepartment(text) {
  for (const [dept, rx] of Object.entries(KEYWORDS)) {
    if (rx.test(text)) return dept;
  }
  return null;
}

/* ── Particles ──────────────────────────────────────────────────────── */
(function() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `--x:${Math.random()*100}%;--dur:${6+Math.random()*10}s;--delay:${Math.random()*8}s`;
    c.appendChild(p);
  }
})();

/* ── DOM ─────────────────────────────────────────────────────────────── */
const stage    = document.getElementById('stage');
const backdrop = document.getElementById('jrv-backdrop');
const panel    = document.getElementById('jrv-panel');
const msgs     = document.getElementById('jrv-msgs');
const input    = document.getElementById('jrv-input');
const sendBtn  = document.getElementById('jrv-send');
const micBtn   = document.getElementById('jrv-mic');
const statusEl = document.getElementById('jrv-status');
const logo     = document.getElementById('jrv-logo');
const tagline  = document.getElementById('jrv-tagline');
let chatHistory = []; // conversation history for context

/* ── Panel ──────────────────────────────────────────────────────────── */
let panelOpen = false, greeted = false;
function openPanel() {
  panelOpen = true;
  backdrop.classList.add('open');
  panel.classList.add('open');
  if (!greeted) {
    greeted = true;
    addMsg('ceo', AGENTS.ceo.greeting, 'ceo');
  }
  setTimeout(() => input.focus(), 300);
}
function closePanel() {
  panelOpen = false;
  panel.classList.remove('open');
  backdrop.classList.remove('open');
  stage.className = 'stage';
  setStatus('Online', '');
}
document.getElementById('orb').addEventListener('click', () => panelOpen ? closePanel() : openPanel());
document.getElementById('jrv-close').addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panelOpen) closePanel(); });

/* Department pills */
document.querySelectorAll('.dept-pill').forEach(btn => {
  const dept = btn.dataset.dept;
  const agent = AGENTS[dept];
  if (agent) {
    btn.style.setProperty('--c', agent.color);
    btn.addEventListener('mouseenter', () => { btn.style.borderColor = agent.color; btn.style.color = agent.color; });
    btn.addEventListener('mouseleave', () => { btn.style.borderColor = ''; btn.style.color = ''; });
  }
  btn.addEventListener('click', () => {
    input.value = btn.dataset.prompt;
    send(dept); // direkt mit Abteilung
  });
});

/* ── Status ─────────────────────────────────────────────────────────── */
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls;
}

/* ── TTS ─────────────────────────────────────────────────────────────── */
let voices = [];
if (window.speechSynthesis) { voices = speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); }; }
function cleanForSpeech(text) {
  return text
    .replace(/[\u{1F000}-\u{1FFFF}]/gu, '')   // Emojis
    .replace(/[*_~`#>|\\]/g, '')               // Markdown
    .replace(/https?:\/\/\S+/g, 'Link')        // URLs → "Link"
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')   // [text](url) → text
    .replace(/:{1,2}\w+:{1,2}/g, '')           // :emoji_codes:
    .replace(/[→←↑↓•·▪▸◆■□]/g, ',')           // Sonderzeichen → Pause
    .replace(/[-]{2,}/g, ',')                  // -- → Pause
    .replace(/\s{2,}/g, ' ')                   // Mehrfach-Leerzeichen
    .trim();
}

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const clean = cleanForSpeech(text);
  const chunks = (clean.match(/[^.!?\n]+[.!?\n]*/g) || [clean]).map(s => s.trim()).filter(Boolean);
  let idx = 0;
  const pickVoice = () => voices.find(v => /^de/i.test(v.lang) && /google/i.test(v.name)) || voices.find(v => v.lang==='de-DE' && !/desktop/i.test(v.name)) || voices.find(v => v.lang.startsWith('de')) || null;
  const onDone = () => { logo.classList.remove('speaking'); stage.className='stage'; setStatus('Online',''); };
  const next = () => {
    if (idx >= chunks.length) { onDone(); return; }
    if (idx===0) { logo.classList.add('speaking'); stage.className='stage speaking'; setStatus('Spricht …','speaking'); }
    const u = new SpeechSynthesisUtterance(chunks[idx++]);
    u.lang='de-DE'; u.rate=1.2; u.pitch=1.05; u.volume=1;
    const v = pickVoice(); if (v) u.voice=v;
    u.onend=()=>setTimeout(next,50); u.onerror=onDone;
    speechSynthesis.speak(u);
  };
  setTimeout(next, 100);
}

/* ── STT ─────────────────────────────────────────────────────────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR) {
  rec = new SR(); rec.lang='de-DE'; rec.continuous=false; rec.interimResults=true;
  rec.onstart = () => { listening=true; micBtn.classList.add('active'); stage.className='stage listening'; setStatus('Hört zu …','listening'); };
  rec.onresult = e => { input.value=Array.from(e.results).map(r=>r[0].transcript).join(''); if(e.results[e.results.length-1].isFinal){stopListening();send();} };
  rec.onerror = rec.onend = () => stopListening();
} else micBtn.disabled=true;
function stopListening() { listening=false; micBtn.classList.remove('active'); stage.className='stage'; setStatus('Online',''); }
micBtn.addEventListener('click', () => { if(!rec)return; if(listening)rec.stop(); else{input.value='';rec.start();} });

/* ── Helpers ─────────────────────────────────────────────────────────── */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addMsg(type, text, agentKey, replyText) {
  const el = document.createElement('div');
  const agent = AGENTS[agentKey] || AGENTS.ceo;

  if (type === 'user') {
    el.className = 'jm user';
    el.innerHTML = `<div class="jlbl">Du</div>${esc(text)}`;

  } else if (type === 'delegation') {
    el.className = 'jm delegation';
    const a = AGENTS[agentKey] || {};
    el.innerHTML = `<span style="color:${a.color||'#D4AF37'}">${a.emoji||'🤖'}</span><span class="delegation-arrow">→</span><span style="color:${a.color||'#D4AF37'};font-weight:700">${a.name||agentKey}</span><span style="opacity:.5">übernimmt</span>`;

  } else if (type === 'thinking') {
    el.className = `jm ${agentKey==='ceo'?'ceo':'agent'}`;
    if (agentKey !== 'ceo') el.style.cssText=`background:${agent.color}0d;border:1px solid ${agent.color}30`;
    el.innerHTML = `<div class="jlbl"><span class="agent-dot" style="background:${agent.color}"></span>${agent.name||'Kashbot'}</div><div class="thinking-dots"><span></span><span></span><span></span></div>`;

  } else {
    // bot / agent response
    el.className = `jm ${agentKey==='ceo'?'ceo':'agent'}`;
    if (agentKey !== 'ceo') el.style.cssText=`background:${agent.color}0d;border:1px solid ${agent.color}30`;
    const spk = replyText ? `<button class="spkbtn" data-text="${esc(replyText)}" title="Vorlesen">🔊</button>` : '';
    el.innerHTML = `<div class="jlbl"><span class="agent-dot" style="background:${agent.color}"></span>${agent.name||'Kashbot'} · ${agent.role||'CEO Agent'}${spk}</div>${esc(text)}`;
    if (spk) el.querySelector('.spkbtn').addEventListener('click', function(){ speak(this.dataset.text); });
  }

  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

/* ── Send ────────────────────────────────────────────────────────────── */
async function send(forceDept) {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true; micBtn.disabled = !!SR;
  speechSynthesis?.cancel();

  addMsg('user', text);

  // 1) CEO analysiert kurz
  setStatus('Analysiert …', 'thinking');
  const ceoThink = addMsg('thinking', '', 'ceo');
  await delay(900);

  // 2) Abteilung bestimmen
  const dept = forceDept || detectDepartment(text);
  const agent = dept ? AGENTS[dept] : null;
  ceoThink.remove();

  if (agent) {
    // CEO delegiert
    const deptLabel = {marketing:'Marketing',design:'Design',video:'Video',sales:'Sales',seo:'SEO',automation:'Automation',social:'Social Media',analytics:'Analytics'}[dept]||dept;
    const ceoMsg = `Alles klar! Ich übergebe das an ${agent.name} aus dem ${deptLabel}-Team.`;
    addMsg('response', ceoMsg, 'ceo');
    await delay(400);
    addMsg('delegation', '', dept);
    await delay(500);
    // Agent stellt sich kurz vor
    addMsg('response', agent.intro, dept);
    await delay(300);
  }

  // 3) Backend-Aufruf
  const activeAgent = agent || AGENTS.ceo;
  setStatus(`${activeAgent.name} denkt nach …`, 'thinking');
  const thinkEl = addMsg('thinking', '', dept || 'ceo');

  const agentId = DEPT_TO_AGENT_ID[dept || 'ceo'] || 'ceo';

  try {
    const res = await fetch(`${BACKEND_URL}/api/agents/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        agent_id: agentId,
        message: text,
        language: "DE",
        history: chatHistory.slice(-10),
        model: "claude-opus-4-8",
        use_knowledge: false,
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data.reply || data.output || data.message || JSON.stringify(data);
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: reply });

    thinkEl.remove();
    setStatus('Online', '');
    addMsg('response', reply, dept || 'ceo', reply);
    if (dept) setTimeout(() => addStudioButton(dept), 400);
    setTimeout(() => speak(reply), 80);

  } catch(err) {
    thinkEl.remove();
    setStatus('Online', '');
    const el = document.createElement('div');
    el.className = 'jm error';
    el.innerHTML = `<div class="jlbl">Fehler</div>Verbindung zum Agenten fehlgeschlagen.<br><small style="opacity:.5">${esc(err.message)}</small>`;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
  }

  sendBtn.disabled = false; micBtn.disabled = false;
  input.focus();
}

/* ── Studio CTA ──────────────────────────────────────────────────────── */
function addStudioButton(dept) {
  const agent = AGENTS[dept];
  if (!agent || !agent.studio) return;
  const s = agent.studio;
  const url = APP_URL + s.path;

  const el = document.createElement('a');
  el.href = url;
  el.target = '_blank';
  el.rel = 'noopener noreferrer';
  el.className = 'studio-cta';
  el.style.cssText = `color:${agent.color};border-color:${agent.color}40;background:${agent.color}0d;align-self:flex-start;`;
  el.innerHTML = `
    <span class="studio-cta-icon">${agent.emoji}</span>
    <span class="studio-cta-text">
      <span style="display:block">${s.label}</span>
      <span style="font-weight:400;font-size:.73rem;opacity:.6">${s.desc}</span>
    </span>
    <span class="studio-cta-arrow">→</span>
  `;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

sendBtn.addEventListener('click', () => send());
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
