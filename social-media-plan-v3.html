      <div class="day-header">
        <span class="day-badge">TAG ${day.id}</span>
        <h2 class="day-title">${day.title}</h2>
        <span class="day-theme">${day.theme}</span>
      </div>
      <div class="content-grid">
        <div class="image-panel">
          <div class="image-tabs">${tabsHtml}</div>
          ${tabContentsHtml}
        </div>
        <div class="copy-panel">
          <div>
            <div class="copy-block-label">📝 Caption / Post-Text</div>
            <div class="copy-block" id="hook-${day.id}">${escHtml(day.hook)}</div>
            <button class="copy-btn" onclick="copyText('hook-${day.id}',this)">📋 Caption kopieren</button>
          </div>
          <div>
            <div class="copy-block-label">🏷️ Hashtags</div>
            <div class="tags-wrap">${hashPills}</div>
            <div class="copy-block" id="tags-${day.id}" style="margin-top:8px;font-size:0.75rem;">${escHtml(day.hashtags)}</div>
            <button class="copy-btn" onclick="copyText('tags-${day.id}',this)">📋 Hashtags kopieren</button>
          </div>
        </div>
      </div>
    `;
    main.appendChild(sec);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function switchTab(btn, tabId) {
  const panel = btn.closest('.image-panel');
  panel.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  panel.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

function copyText(id, btn) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.textContent).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓ Kopiert!';
    showToast();
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = btn.textContent.includes('Hashtag') ? '📋 Hashtags kopieren' : '📋 Caption kopieren';
    }, 2000);
  });
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Active day pill on scroll
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const id = e.target.id.replace('day','');
      document.querySelectorAll('.day-pill').forEach(p => {
        p.classList.toggle('active', p.href.endsWith('#day'+id));
      });
    }
  });
}, { threshold: 0.15, rootMargin: '-180px 0px -60% 0px' });

buildNav();
buildContent();
document.querySelectorAll('.day-section').forEach(s => observer.observe(s));
</script>
</body>
</html>
