<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVJIS | KickstarterCash KI-Assistent</title>
<style>
  /* ── Reset & Base ───────────────────────────────────────────────────── */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;height:100%}
  body{
    background:radial-gradient(circle at 50% 35%,#1c170f 0%,#120e09 60%,#0a0806 100%);
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    color:#F3ECDD;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px 0 60px;user-select:none;overflow:hidden;
  }

  /* ── Particles ──────────────────────────────────────────────────────── */
  .particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .particle{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#EBCB72;opacity:0;
    animation:float var(--dur,8s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
    left:var(--x,50%);top:110%;
  }
  @keyframes float{
    0%{opacity:0;transform:translateY(0) scale(1)}
    10%{opacity:.6}
    90%{opacity:.2}
    100%{opacity:0;transform:translateY(-110vh) scale(.3)}
  }

  /* ── Orb Stage ──────────────────────────────────────────────────────── */
  .stage{position:relative;width:360px;height:360px;display:flex;align-items:center;justify-content:center;z-index:1}
  .orb{
    position:relative;width:210px;height:210px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#FBE9A6,#F6DC8E 25%,#D9A93F 60%,#B07F2A 100%);
    box-shadow:0 0 60px 12px rgba(217,169,63,.55),0 0 140px 30px rgba(176,127,42,.30),inset 0 0 50px rgba(255,255,255,.30);
    transition:.4s;animation:breathe 5s ease-in-out infinite;
  }
  .orb::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0%,rgba(251,233,166,.08) 30%,transparent 60%);
    animation:spin 8s linear infinite;
  }
  .orb::after{
    content:"";position:absolute;inset:18%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.9),rgba(251,233,166,.15) 60%,transparent 70%);
    filter:blur(2px)
  }

  /* Jarvjis "J" im Orb */
  .orb-letter{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:72px;font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(251,233,166,.6));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));
    font-family:Georgia,serif;pointer-events:none;z-index:2;
    text-shadow:none;
  }

  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(235,203,114,.30);top:50%;left:50%;transform:translate(-50%,-50%)}
  .ring.r1{width:265px;height:265px;border-style:dashed;animation:spin 14s linear infinite}
  .ring.r2{width:315px;height:315px;border-color:rgba(235,203,114,.15);animation:spin 22s linear infinite reverse}
  .ring.r3{width:360px;height:360px;border-color:rgba(235,203,114,.08);border-top-color:rgba(235,203,114,.45);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .stage.listening .orb{
    animation:breathe 1.2s ease-in-out infinite;
    box-shadow:0 0 80px 20px rgba(43,255,180,.45),0 0 160px 40px rgba(20,220,150,.25),inset 0 0 50px rgba(255,255,255,.35);
    filter:hue-rotate(-20deg)
  }
  .stage.speaking .orb{
    box-shadow:0 0 100px 28px rgba(251,233,166,.75),0 0 180px 50px rgba(217,169,63,.50),inset 0 0 60px rgba(255,255,255,.50)
  }
  .orb:hover{
    box-shadow:0 0 90px 22px rgba(246,220,142,.85),0 0 180px 50px rgba(217,169,63,.55),inset 0 0 60px rgba(255,255,255,.45)
  }

  .title{
    letter-spacing:.5em;font-size:14px;margin-top:32px;opacity:.9;z-index:1;
    background:linear-gradient(135deg,#FBE9A6,#EBCB72);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 0 12px rgba(235,203,114,.6));font-weight:700;
  }
  .subtitle{font-size:11px;letter-spacing:.3em;opacity:.45;margin-top:8px;text-transform:uppercase;color:#C9BB9B;z-index:1}
  .hint{font-size:11px;opacity:.28;margin-top:18px;letter-spacing:.08em;color:#9f937c;z-index:1;animation:blink 3s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.28}50%{opacity:.5}}

  /* ── Backdrop ───────────────────────────────────────────────────────── */
  #jrv-backdrop{
    display:none;position:fixed;inset:0;z-index:100;
    background:#00000099;backdrop-filter:blur(8px);
  }
  #jrv-backdrop.open{display:block;animation:bdIn .22s ease}
  @keyframes bdIn{from{opacity:0}to{opacity:1}}

  /* ── Chat Panel ─────────────────────────────────────────────────────── */
  #jrv-panel{
    position:fixed;z-index:101;
    top:50%;left:50%;
    width:460px;max-width:calc(100vw - 20px);
    height:640px;max-height:calc(100vh - 40px);
    background:#0d0b08;
    border:1px solid #3a2c10;
    border-radius:24px;
    box-shadow:0 32px 100px #000e,0 0 0 1px rgba(235,203,114,.08),0 0 60px rgba(217,169,63,.08);
    flex-direction:column;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;
    display:none;transform:translate(-50%,-50%);
  }
  #jrv-panel.open{display:flex;animation:panelIn .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes panelIn{from{opacity:0;transform:translate(-50%,-48%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  /* Header */
  #jrv-head{
    padding:18px 20px 16px;
    background:linear-gradient(135deg,#1a1208,#120e09);
    border-bottom:1px solid #3a2c10;
    display:flex;align-items:center;gap:14px;flex-shrink:0;
    position:relative;overflow:hidden;
  }
  #jrv-head::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(235,203,114,.03),transparent);
    animation:shimmer 4s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}

  #jrv-logo{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 35% 35%,#FBE9A6,#D9A93F 55%,#B07F2A 100%);
    box-shadow:0 0 16px rgba(217,169,63,.6);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:900;color:rgba(255,255,255,.9);
    font-family:Georgia,serif;
    transition:box-shadow .3s;position:relative;z-index:1;
  }
  #jrv-logo.speaking{animation:logoPulse 1.1s ease-in-out infinite}
  @keyframes logoPulse{
    0%,100%{box-shadow:0 0 20px rgba(251,233,166,.8),0 0 40px rgba(217,169,63,.5)}
    50%{box-shadow:0 0 40px rgba(251,233,166,1),0 0 70px rgba(235,203,114,.8)}
  }
  #jrv-head-info{flex:1;position:relative;z-index:1}
  #jrv-head h2{
    font-size:1rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin:0 0 3px;
    background:linear-gradient(135deg,#FBE9A6,#EBCB72);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  #jrv-tagline{font-size:.65rem;color:#6a6050;letter-spacing:.08em;margin-bottom:2px}
  #jrv-status{font-size:.68rem;color:#7d745f;letter-spacing:.04em;transition:color .3s;display:flex;align-items:center;gap:5px}
  #jrv-status::before{content:"";width:6px;height:6px;border-radius:50%;background:#3a3028;transition:background .3s}
  #jrv-status.online::before{background:#4ade80;box-shadow:0 0 6px #4ade8088}
  #jrv-status.listening{color:#7ec8a0}
  #jrv-status.listening::before{background:#7ec8a0;box-shadow:0 0 6px #7ec8a088}
  #jrv-status.speaking{color:#F6DC8E}
  #jrv-status.speaking::before{background:#F6DC8E;box-shadow:0 0 6px #F6DC8E88;animation:statusPulse .8s ease-in-out infinite}
  @keyframes statusPulse{0%,100%{opacity:1}50%{opacity:.4}}
  #jrv-close{
    background:none;border:none;cursor:pointer;color:#6f6655;
    font-size:1.1rem;line-height:1;padding:6px 8px;border-radius:8px;
    transition:color .2s,background .2s;position:relative;z-index:1;
  }
  #jrv-close:hover{color:#EBCB72;background:rgba(235,203,114,.1)}

  /* Department pills */
  #jrv-depts{
    padding:10px 16px;background:#0f0c09;border-bottom:1px solid #2a1e06;
    display:flex;gap:6px;overflow-x:auto;flex-shrink:0;
  }
  #jrv-depts::-webkit-scrollbar{height:0}
  .dept-pill{
    flex-shrink:0;background:none;border:1px solid #2a2010;border-radius:20px;
    padding:5px 12px;font-size:.68rem;color:#7d745f;cursor:pointer;
    transition:all .2s;letter-spacing:.04em;white-space:nowrap;
  }
  .dept-pill:hover{border-color:#EBCB72;color:#EBCB72;background:rgba(235,203,114,.06)}

  /* Messages */
  #jrv-msgs{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  #jrv-msgs::-webkit-scrollbar{width:4px}
  #jrv-msgs::-webkit-scrollbar-track{background:transparent}
  #jrv-msgs::-webkit-scrollbar-thumb{background:#3a2c10;border-radius:3px}
  .jm{max-width:85%;padding:11px 15px;border-radius:16px;font-size:.88rem;line-height:1.58;animation:msgIn .2s ease}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .jm.user{align-self:flex-end;background:linear-gradient(135deg,#2a1e06,#1e1504);border:1px solid #3a2c10;border-bottom-right-radius:4px;color:#F6ECCF}
  .jm.bot{align-self:flex-start;background:#161209;border:1px solid #2a2010;border-bottom-left-radius:4px;color:#C9BB9B}
  .jm.thinking{align-self:flex-start;background:#161209;border:1px solid #2a2010;border-bottom-left-radius:4px;color:#6a6050;font-style:italic}
  .jm.error{align-self:flex-start;background:#1e0a0a;border:1px solid #5c1a1a;color:#f08080;border-bottom-left-radius:4px}
  .jlbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;opacity:.5;display:flex;align-items:center;gap:7px}
  .spkbtn{background:none;border:none;cursor:pointer;font-size:.78rem;opacity:.4;padding:0;line-height:1;transition:opacity .2s}
  .spkbtn:hover{opacity:1}

  /* Thinking dots */
  .thinking-dots{display:inline-flex;gap:4px;align-items:center;margin-top:2px}
  .thinking-dots span{width:7px;height:7px;border-radius:50%;background:#6a6050;animation:dot .9s ease-in-out infinite}
  .thinking-dots span:nth-child(2){animation-delay:.18s}
  .thinking-dots span:nth-child(3){animation-delay:.36s}
  @keyframes dot{0%,60%,100%{transform:scale(.8);opacity:.4}30%{transform:scale(1.2);opacity:1}}

  /* Footer */
  #jrv-foot{padding:14px 16px 16px;background:#120e09;border-top:1px solid #3a2c10;display:flex;gap:9px;align-items:center;flex-shrink:0}
  #jrv-input{
    flex:1;background:#0a0806;border:1px solid #2a2010;border-radius:12px;
    padding:12px 15px;color:#F3ECDD;font-size:.88rem;outline:none;
    transition:border-color .2s,box-shadow .2s;font-family:inherit;
  }
  #jrv-input:focus{border-color:#EBCB72;box-shadow:0 0 0 2px rgba(235,203,114,.08)}
  #jrv-input::placeholder{color:#4a4030}
  #jrv-mic{
    background:#1c170f;border:1px solid #3a2c10;border-radius:12px;
    padding:12px 13px;color:#7d745f;font-size:1.05rem;
    cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;line-height:1;
  }
  #jrv-mic:hover{background:#2a1e06;color:#EBCB72}
  #jrv-mic.active{background:#1a1200;border-color:#c08020;color:#f0c060;animation:micPulse .8s ease-in-out infinite}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,128,32,.4)}50%{box-shadow:0 0 0 6px rgba(192,128,32,0)}}
  #jrv-send{
    background:linear-gradient(135deg,#E7C167,#D9A93F 50%,#B07F2A);
    border:none;border-radius:12px;padding:12px 20px;
    color:#1a1206;font-size:.85rem;font-weight:800;
    cursor:pointer;transition:filter .2s,transform .1s;letter-spacing:.06em;font-family:inherit;
  }
  #jrv-send:hover{filter:brightness(1.15)}
  #jrv-send:active{transform:scale(.97)}
  #jrv-send:disabled,#jrv-mic:disabled{opacity:.35;cursor:not-allowed}
  #jrv-badge{text-align:center;font-size:.58rem;color:#2a2010;padding:0 16px 10px;letter-spacing:.06em}

  /* ── Welcome Screen ─────────────────────────────────────────────────── */
  #jrv-welcome{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;gap:16px;
  }
  .welcome-orb{
    width:72px;height:72px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#FBE9A6,#D9A93F 55%,#B07F2A 100%);
    box-shadow:0 0 30px rgba(217,169,63,.5);
    display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:900;color:rgba(255,255,255,.9);font-family:Georgia,serif;
    animation:breathe 4s ease-in-out infinite;
  }
  .welcome-title{font-size:1.1rem;font-weight:700;letter-spacing:.15em;
    background:linear-gradient(135deg,#FBE9A6,#EBCB72);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .welcome-text{font-size:.82rem;color:#7d745f;line-height:1.6;max-width:300px}
  .welcome-btns{display:flex;flex-direction:column;gap:8px;width:100%}
  .welcome-btn{
    padding:12px 16px;background:#161209;border:1px solid #2a2010;border-radius:12px;
    color:#C9BB9B;font-size:.82rem;text-align:left;cursor:pointer;
    transition:all .2s;display:flex;align-items:center;gap:10px;
  }
  .welcome-btn:hover{border-color:#EBCB72;background:#1a1508;color:#F6ECCF}
  .welcome-btn-icon{font-size:1.1rem;flex-shrink:0}
</style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="stage" id="stage">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="orb" id="orb">
      <div class="orb-letter">J</div>
    </div>
  </div>
  <div class="title">J &middot; A &middot; R &middot; V &middot; J &middot; I &middot; S</div>
  <div class="subtitle">KickstarterCash · KI-Agent System</div>
  <div class="hint">&#x25BA; Orb anklicken zum Starten</div>

  <div id="jrv-backdrop"></div>

  <div id="jrv-panel" role="dialog" aria-modal="true" aria-label="Jarvjis KI-Assistent">
    <div id="jrv-head">
      <div id="jrv-logo">J</div>
      <div id="jrv-head-info">
        <h2>JARVJIS</h2>
        <div id="jrv-tagline">KickstarterCash · CEO Agent</div>
        <div id="jrv-status" class="online">Online</div>
      </div>
      <button id="jrv-close" title="Schließen">✕</button>
    </div>

    <!-- Department shortcuts -->
    <div id="jrv-depts">
      <button class="dept-pill" data-prompt="Ich brauche Hilfe mit meiner Marketing-Strategie.">🎯 Marketing</button>
      <button class="dept-pill" data-prompt="Kannst du mir beim Design helfen?">🎨 Design</button>
      <button class="dept-pill" data-prompt="Ich brauche Video-Ideen für Social Media.">🎬 Video</button>
      <button class="dept-pill" data-prompt="Hilf mir meinen Sales-Funnel zu optimieren.">💰 Sales</button>
      <button class="dept-pill" data-prompt="Ich brauche SEO-Hilfe für meine Website.">🌍 SEO</button>
      <button class="dept-pill" data-prompt="Welche Automationen empfiehlst du für mein Business?">⚡ Automation</button>
      <button class="dept-pill" data-prompt="Erstelle einen Inhaltsplan für Social Media.">📱 Social Media</button>
    </div>

    <div id="jrv-msgs" role="log" aria-live="polite">
      <!-- Welcome shown on first open via JS -->
    </div>

    <div id="jrv-foot">
      <input id="jrv-input" type="text" placeholder="Frage Jarvjis etwas …" autocomplete="off" />
      <button id="jrv-mic" title="Spracheingabe">🎙️</button>
      <button id="jrv-send">Senden</button>
    </div>
    <div id="jrv-badge">Powered by KickstarterCash · n8n · Claude AI</div>
  </div>

<script>
  /* ── Config ──────────────────────────────────────────────────────────── */
  const WEBHOOK = "https://nadjas.app.n8n.cloud/webhook/repal"; // ← n8n Webhook hier eintragen

  /* ── Particles ───────────────────────────────────────────────────────── */
  (function() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `--x:${Math.random()*100}%;--dur:${6+Math.random()*10}s;--delay:${Math.random()*8}s`;
      container.appendChild(p);
    }
  })();

  /* ── Elements ────────────────────────────────────────────────────────── */
  const stage    = document.getElementById('stage');
  const backdrop = document.getElementById('jrv-backdrop');
  const panel    = document.getElementById('jrv-panel');
  const msgs     = document.getElementById('jrv-msgs');
  const input    = document.getElementById('jrv-input');
  const sendBtn  = document.getElementById('jrv-send');
  const micBtn   = document.getElementById('jrv-mic');
  const statusEl = document.getElementById('jrv-status');
  const logo     = document.getElementById('jrv-logo');

  /* ── Open / Close ────────────────────────────────────────────────────── */
  let panelOpen = false, greeted = false;

  function openPanel() {
    panelOpen = true;
    backdrop.classList.add('open');
    panel.classList.add('open');
    if (!greeted) {
      greeted = true;
      addMsg('bot',
        'Willkommen bei KickstarterCash! Ich bin Jarvjis, dein persönlicher KI-CEO-Agent. ' +
        'Ich helfe dir mit Marketing, Design, Video, Sales, SEO, Automation und mehr. ' +
        'Wähle eine Abteilung oben oder stelle mir direkt deine Frage!');
    }
    setTimeout(() => input.focus(), 300);
  }
  function closePanel() {
    panelOpen = false;
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    stage.className = 'stage';
    statusEl.textContent = 'Online'; statusEl.className = 'online';
  }

  document.getElementById('orb').addEventListener('click', () => panelOpen ? closePanel() : openPanel());
  document.getElementById('jrv-close').addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && panelOpen) closePanel(); });

  /* Department pills */
  document.querySelectorAll('.dept-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.prompt;
      send();
    });
  });

  /* ── Voices / TTS ────────────────────────────────────────────────────── */
  let voices = [];
  function loadVoices() { voices = window.speechSynthesis?.getVoices() ?? []; }
  if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const chunks = (text.match(/[^.!?\n]+[.!?\n]*/g) || [text]).map(s => s.trim()).filter(Boolean);
    let idx = 0;
    const pickVoice = () => {
      const list = voices.length ? voices : window.speechSynthesis.getVoices();
      return list.find(v => /^de/i.test(v.lang) && /google/i.test(v.name))
          || list.find(v => v.lang === 'de-DE' && /stefan|anna/i.test(v.name) && !/desktop/i.test(v.name))
          || list.find(v => v.lang === 'de-DE' && !/desktop/i.test(v.name))
          || list.find(v => v.lang.startsWith('de'))
          || null;
    };
    const onDone = () => {
      logo.classList.remove('speaking'); stage.className = 'stage';
      statusEl.textContent = 'Online'; statusEl.className = 'online';
    };
    const next = () => {
      if (idx >= chunks.length) { onDone(); return; }
      if (idx === 0) {
        logo.classList.add('speaking'); stage.className = 'stage speaking';
        statusEl.textContent = 'Spricht …'; statusEl.className = 'speaking';
      }
      const utt = new SpeechSynthesisUtterance(chunks[idx++]);
      utt.lang = 'de-DE'; utt.rate = 1.2; utt.pitch = 1.05; utt.volume = 1;
      const v = pickVoice(); if (v) utt.voice = v;
      utt.onend = () => setTimeout(next, 50);
      utt.onerror = onDone;
      window.speechSynthesis.speak(utt);
    };
    setTimeout(next, 100);
  }

  /* ── Speech Recognition ──────────────────────────────────────────────── */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  if (SR) {
    rec = new SR(); rec.lang = 'de-DE'; rec.continuous = false; rec.interimResults = true;
    rec.onstart = () => {
      listening = true; micBtn.classList.add('active');
      stage.className = 'stage listening';
      statusEl.textContent = 'Hört zu …'; statusEl.className = 'listening';
    };
    rec.onresult = e => {
      input.value = Array.from(e.results).map(r => r[0].transcript).join('');
      if (e.results[e.results.length-1].isFinal) { stopListening(); send(); }
    };
    rec.onerror = rec.onend = () => stopListening();
  } else { micBtn.disabled = true; }
  function stopListening() {
    listening = false; micBtn.classList.remove('active');
    stage.className = 'stage';
    statusEl.textContent = 'Online'; statusEl.className = 'online';
  }
  micBtn.addEventListener('click', () => {
    if (!rec) return;
    if (listening) rec.stop(); else { input.value = ''; rec.start(); }
  });

  /* ── Helpers ─────────────────────────────────────────────────────────── */
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function addMsg(role, text, replyText) {
    const d = document.createElement('div');
    d.className = 'jm ' + role;
    const lbl = {user:'Du', bot:'Jarvjis', thinking:'Jarvjis', error:'Fehler'}[role] || role;
    const spk = (role === 'bot' && replyText) ? `<button class="spkbtn" data-text="${esc(replyText)}" title="Vorlesen">🔊</button>` : '';
    if (role === 'thinking') {
      d.innerHTML = `<div class="jlbl">Jarvjis</div><div class="thinking-dots"><span></span><span></span><span></span></div>`;
    } else {
      d.innerHTML = `<div class="jlbl">${lbl}${spk}</div>${esc(text)}`;
      if (spk) d.querySelector('.spkbtn').addEventListener('click', function() { speak(this.dataset.text); });
    }
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  /* ── Send ────────────────────────────────────────────────────────────── */
  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendBtn.disabled = true; micBtn.disabled = !!SR;
    addMsg('user', text);
    const thinking = addMsg('thinking', '');
    statusEl.textContent = 'Denkt nach …'; statusEl.className = '';

    try {
      const res = await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatInput: text })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const reply = data.reply || data.output || data.message || JSON.stringify(data);
      thinking.className = 'jm bot';
      const spk = `<button class="spkbtn" data-text="${esc(reply)}" title="Vorlesen">🔊</button>`;
      thinking.innerHTML = `<div class="jlbl">Jarvjis${spk}</div>${esc(reply)}`;
      thinking.querySelector('.spkbtn').addEventListener('click', function() { speak(this.dataset.text); });
      setTimeout(() => speak(reply), 50);
    } catch(err) {
      thinking.className = 'jm error';
      thinking.innerHTML = `<div class="jlbl">Fehler</div>Verbindung zum Agenten fehlgeschlagen. Bitte versuche es erneut.<br><small style="opacity:.5">${esc(err.message)}</small>`;
      statusEl.textContent = 'Fehler'; statusEl.className = '';
    }
    sendBtn.disabled = false; micBtn.disabled = false;
    statusEl.textContent = 'Online'; statusEl.className = 'online';
    input.focus(); msgs.scrollTop = msgs.scrollHeight;
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
