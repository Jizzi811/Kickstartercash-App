# Brandmind production frontend (kashbot3.netlify.app).
# Netlify reads this from the repo root on push to main.
[build]
  base = "frontend"
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "frontend/build"

[build.environment]
  # Match .github/workflows/ci.yml: CRA fails on lint warnings when CI=true.
  CI = "false"
  NODE_VERSION = "20"

# SPA fallback so client-side routes (/auth, /brand-brain, …) work on reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
